<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flow Character Prompter</title>
  <style>
    :root {
      --bg:       #141420;
      --surface:  #1c1c2e;
      --border:   #2a2a4a;
      --accent:   #7c6af7;
      --accent-h: #6a59e0;
      --text:     #e8e8f0;
      --dim:      #666680;
      --success:  #4ecba0;
      --warn:     #f5a623;
      --error:    #f06070;
      --info:     #7eb8ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .header h1 { font-size: 13px; font-weight: 600; color: var(--success); }
    .header .stage {
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ── Body ── */
    .body { padding: 12px 16px; }

    .hint {
      font-size: 11px;
      color: var(--dim);
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .hint code {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
      color: var(--info);
      font-size: 11px;
    }

    /* ── Settings row ── */
    .settings-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .settings-row label {
      font-size: 11px;
      color: var(--dim);
      white-space: nowrap;
      flex-shrink: 0;
    }
    #folder-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 11px;
      font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
      padding: 5px 8px;
      outline: none;
      transition: border-color 0.15s;
      min-width: 0;
    }
    #folder-input::placeholder { color: var(--dim); }
    #folder-input:focus { border-color: var(--accent); }

    /* ── Textarea ── */
    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
      padding: 8px 10px;
      resize: vertical;
      outline: none;
      line-height: 1.5;
      transition: border-color 0.15s;
    }
    textarea::placeholder { color: var(--dim); }
    textarea:focus  { border-color: var(--accent); }
    textarea:disabled { opacity: 0.5; }

    #queue-script { height: 130px; }

    /* ── Prompt count ── */
    #prompt-count {
      margin-top: 5px;
      font-size: 11px;
      color: var(--dim);
      font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
      min-height: 16px;
    }
    #prompt-count.has-errors { color: var(--warn); }

    /* ── Prompt status list ── */
    #prompt-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 180px;
      overflow-y: auto;
    }
    #prompt-list:empty { display: none; }
    #prompt-list::-webkit-scrollbar { width: 4px; }
    #prompt-list::-webkit-scrollbar-track { background: transparent; }
    #prompt-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .prompt-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11px;
      font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
      transition: border-color 0.2s;
    }
    .prompt-row-num {
      color: var(--dim);
      flex-shrink: 0;
      width: 18px;
      text-align: right;
      font-size: 10px;
    }
    .prompt-row-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }
    .prompt-row-badge {
      flex-shrink: 0;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }

    /* pending */
    .prompt-row[data-status="pending"] .prompt-row-badge {
      background: var(--border);
      color: var(--dim);
    }

    /* generating — pulsing accent border */
    .prompt-row[data-status="generating"] {
      border-color: var(--accent);
      animation: row-pulse 1.4s ease-in-out infinite;
    }
    .prompt-row[data-status="generating"] .prompt-row-badge {
      background: var(--accent);
      color: #fff;
    }
    @keyframes row-pulse {
      0%, 100% { border-color: var(--accent); }
      50%       { border-color: var(--accent-h);
                  box-shadow: 0 0 0 2px rgba(124,106,247,0.18); }
    }

    /* done */
    .prompt-row[data-status="done"] { border-color: var(--success); }
    .prompt-row[data-status="done"] .prompt-row-text { color: var(--dim); }
    .prompt-row[data-status="done"] .prompt-row-badge {
      background: rgba(78,203,160,0.15);
      color: var(--success);
    }

    /* failed */
    .prompt-row[data-status="failed"] { border-color: var(--error); }
    .prompt-row[data-status="failed"] .prompt-row-badge {
      background: rgba(240,96,112,0.15);
      color: var(--error);
    }

    /* stopped */
    .prompt-row[data-status="stopped"] { opacity: 0.4; }
    .prompt-row[data-status="stopped"] .prompt-row-badge {
      background: var(--border);
      color: var(--dim);
    }

    /* ── Buttons ── */
    .buttons {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      align-items: center;
    }

    button {
      padding: 7px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      transition: background 0.12s, opacity 0.12s;
      white-space: nowrap;
    }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    #run-queue-btn {
      background: var(--accent);
      color: #fff;
      flex: 1;
    }
    #run-queue-btn:not(:disabled):hover { background: var(--accent-h); }

    #stop-queue-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    #stop-queue-btn:not(:disabled):hover { border-color: var(--error); color: var(--error); }

    /* ── Delay row ── */
    .delay-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .delay-row label {
      font-size: 11px;
      color: var(--dim);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .delay-row input[type="number"] {
      width: 66px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 11px;
      font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
      padding: 5px 6px;
      outline: none;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
    }
    .delay-row input[type="number"]::-webkit-inner-spin-button,
    .delay-row input[type="number"]::-webkit-outer-spin-button { opacity: 0.4; }
    .delay-row input[type="number"]:focus { border-color: var(--accent); }
    .delay-row input[type="number"]:disabled { opacity: 0.5; }
    .delay-sep  { color: var(--dim); font-size: 11px; }
    .delay-unit { font-size: 11px; color: var(--dim); white-space: nowrap; flex: 1; }

    /* ── Queue progress ── */
    .queue-progress {
      margin-top: 8px;
      font-size: 11px;
      color: var(--info);
      font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
    }

    /* ── Parse errors ── */
    .parse-errors {
      margin-top: 6px;
      background: #2a1a1e;
      border: 1px solid var(--error);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 11px;
      font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
      color: var(--error);
      line-height: 1.6;
    }

    /* ── Failed prompts box ── */
    #failed-box {
      margin-top: 10px;
      background: rgba(240,96,112,0.07);
      border: 1px solid var(--error);
      border-radius: 6px;
      padding: 7px 10px;
    }
    #failed-box-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--error);
      margin-bottom: 5px;
    }
    #failed-entries {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .failed-entry {
      font-size: 11px;
      font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
      color: var(--error);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Log ── */
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0 5px;
    }
    .log-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--dim);
    }

    #log {
      height: 200px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
      font-size: 11px;
      line-height: 1.7;
    }
    #log::-webkit-scrollbar { width: 4px; }
    #log::-webkit-scrollbar-track { background: transparent; }
    #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .log-entry         { color: var(--info); }
    .log-entry.success { color: var(--success); }
    .log-entry.warn    { color: var(--warn); }
    .log-entry.error   { color: var(--error); }
    .log-entry.prompt  { color: var(--dim); font-style: italic; }

    .log-empty {
      color: var(--dim);
      font-style: italic;
      font-size: 11px;
    }

    /* ── Status bar ── */
    #status-bar {
      padding: 7px 16px;
      font-size: 11px;
      color: var(--dim);
      border-top: 1px solid var(--border);
      min-height: 28px;
      line-height: 1.4;
    }
    #status-bar.running { color: var(--info); }
    #status-bar.done    { color: var(--success); }
    #status-bar.error   { color: var(--error); }
    #status-bar.warn    { color: var(--warn); }
  </style>
</head>
<body>

  <div class="header">
    <h1>Flow Character Prompter</h1>
    <span class="stage">Queue mode</span>
  </div>

  <div class="body">

    <p class="hint">
      One block per prompt, blank-line separated.
      Format: <code>[0:00]: description with @{Character} tokens</code>
    </p>

    <div class="settings-row">
      <label for="folder-input">Download folder</label>
      <input
        id="folder-input"
        type="text"
        placeholder="FlowOutputs"
        spellcheck="false"
        autocomplete="off"
        title="Subfolder inside your Downloads directory where generated images are saved"
      >
    </div>

    <textarea
      id="queue-script"
      placeholder="[0:00]: Wide shot of @{Trevor} in the rain

[0:05]: Close up on @{Trevor}'s face,
dramatic lighting, shallow depth of field"
      spellcheck="false"
    ></textarea>

    <div id="prompt-count"></div>

    <div id="prompt-list"></div>

    <div id="parse-errors" class="parse-errors" hidden></div>

    <div class="delay-row">
      <label>Delay</label>
      <input id="delay-min" type="number" min="0" step="500" value="3000">
      <span class="delay-sep">–</span>
      <input id="delay-max" type="number" min="0" step="500" value="8000">
      <span class="delay-unit">ms between prompts</span>
    </div>

    <div class="buttons">
      <button id="run-queue-btn">Run Queue</button>
      <button id="stop-queue-btn" disabled>Stop</button>
      <button id="extract-roster-btn" title="Read every character's name and ID from the picker in one shot, for CHARACTER_ID_MAP">Extract Character IDs</button>
      <button id="diagnose-picker-btn" title="Dump the picker's React fiber tree (component names, array props, query props) when the roster extraction can't find a matching prop">Diagnose Picker</button>
      <button id="harvest-ids-btn" title="Insert each given character name for real via the picker, one at a time, and read back its true characterServerId — slower than Extract Character IDs but doesn't depend on finding the right React prop">Harvest IDs (slow)</button>
      <button id="diagnose-sidefx-btn" title="Snapshot network activity and client-side storage/caches before and after a real picker-driven character insertion, then diff, to find what 'Add to Prompt' does beyond mutating the Slate document">Diagnose Add-to-Prompt Side Effects</button>
    </div>

    <div id="queue-progress" class="queue-progress" hidden></div>

    <!-- ── Failed prompts ── -->
    <div id="failed-box" hidden>
      <div id="failed-box-label">Failed prompts</div>
      <div id="failed-entries"></div>
    </div>

    <!-- ── Log ── -->
    <div class="log-header">
      <span class="log-label">Log</span>
    </div>

    <div id="log">
      <span class="log-empty">Log output will appear here…</span>
    </div>
  </div>

  <div id="status-bar">Ready — open a Flow prompt tab first</div>

  <script src="popup.js"></script>
</body>
</html>
